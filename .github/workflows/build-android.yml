name: Zbuduj APK Gaba Leki
on:
  push:
    branches: [gaba-med-2026-11]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj źródła
        run: base64 -d project-src.b64 | tar -xJ
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gaba-Leki-v2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Opublikuj APK i źródła
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gaba-Leki-v2.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app settings.gradle build.gradle README.md dist/Gaba-Leki-v2.0.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Gaba Leki: kod zrodlowy i APK v2.0'
            git push
          fi

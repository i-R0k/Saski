name: Zbuduj APK Gaba Leki
on:
  push:
    branches: [gaba-med-2026-11]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj źródła tylko przy pierwszym uruchomieniu
        run: |
          if [ ! -f app/src/main/java/pl/saski/gaba/MainActivity.java ]; then
            base64 -d project-src.b64 | tar -xJ
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gaba-Leki-v2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Opublikuj APK i źródła
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gaba-Leki-v2.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app settings.gradle build.gradle README.md dist/Gaba-Leki-v2.0.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Gaba Leki: kod zrodlowy i APK v2.0'
            git push
          fi
